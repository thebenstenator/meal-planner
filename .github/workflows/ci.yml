name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a deploy by hand (e.g. from the GitHub mobile app)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The e2e suite talks to a real Supabase (auth signup, matcher RPC), so
      # boot the local stack. Migrations + seed are applied by `supabase start`.
      # The app's default local anon key matches this stack (see lib/config/env).
      - uses: supabase/setup-cli@v1
        with:
          # Pin to the version validated locally; newer CLIs change local-stack
          # defaults (e.g. auth) and broke the household trigger flow in CI.
          version: 2.104.0

      - name: Start Supabase
        run: supabase start

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Stop Supabase
        if: ${{ always() }}
        run: supabase stop || true

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Auto-deploy to cloud Supabase once tests pass on main. Always runs
  # `supabase db push` (idempotent — it only applies migrations missing from the
  # remote history), and (re)deploys the Edge Functions that changed in this push.
  # Needs two repo secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
  # Until they're set, the job no-ops (stays green) so nothing breaks meanwhile.
  deploy:
    name: Deploy (Supabase)
    needs: [verify, e2e]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # The project ref isn't secret (it's in your project URLs), so it's inline.
      SUPABASE_PROJECT_REF: qxeuqjeoukpmdxogdotu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff what changed in this push

      - name: Check deploy secrets are present
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase deploy secrets not set — skipping deploy. Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in repo Settings → Secrets → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Migrations always push (db push is idempotent), so we only diff to decide
      # which Edge Functions to redeploy. Guarding migrations on the diff was a
      # trap: a migration whose commit failed CI never redeployed if the fixup
      # commit didn't also touch supabase/migrations/.
      - name: Detect changed functions
        id: diff
        if: steps.guard.outputs.ready == 'true'
        run: |
          # Manual runs have no diff base — redeploy all functions to be safe.
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          echo "$CHANGED" | grep -q '^supabase/functions/' && echo "functions=true" >> "$GITHUB_OUTPUT" || echo "functions=false" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.ready == 'true'
        with:
          version: 2.104.0 # match the version pinned for the local/e2e stack

      - name: Link project
        if: steps.guard.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Always push — supabase db push only applies migrations not yet in the
      # remote history, so it's a no-op when there's nothing pending.
      - name: Push database migrations
        if: steps.guard.outputs.ready == 'true'
        run: supabase db push

      - name: Deploy Edge Functions
        if: steps.guard.outputs.ready == 'true' && steps.diff.outputs.functions == 'true'
        run: |
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            echo "→ deploying $name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
          done
