name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The e2e suite talks to a real Supabase (auth signup, matcher RPC), so
      # boot the local stack. Migrations + seed are applied by `supabase start`.
      # The app's default local anon key matches this stack (see lib/config/env).
      - uses: supabase/setup-cli@v1
        with:
          # Pin to the version validated locally; newer CLIs change local-stack
          # defaults (e.g. auth) and broke the household trigger flow in CI.
          version: 2.104.0

      - name: Start Supabase
        run: supabase start

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Stop Supabase
        if: ${{ always() }}
        run: supabase stop || true

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
