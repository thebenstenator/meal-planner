name: Reminders

# Nudges households about pantry items expiring soon. Fires the send-reminders
# Edge Function once a day. No-ops until the CRON_SECRET repo secret is set (and
# the function's VAPID secrets are configured in Supabase).
on:
  schedule:
    - cron: '0 15 * * *' # 15:00 UTC daily (~morning across the US)
  workflow_dispatch: # run on demand to test

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET not set — skipping reminders."
            exit 0
          fi
          curl -fsS -X POST \
            "https://qxeuqjeoukpmdxogdotu.supabase.co/functions/v1/send-reminders" \
            -H "x-cron-secret: $CRON_SECRET"
